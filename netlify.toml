[build]
  publish = "."

[[redirects]]
  from = "/student"
  to = "/student_dashboard.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to = "/student_dashboard.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

